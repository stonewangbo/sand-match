<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>流沙同色消除</title>
  </head>
  <body>
    <div id="app">
      <header class="top-bar">
        <h1 class="brand">流沙同色消除</h1>
        <div id="hud" class="hud"></div>
      </header>

      <main class="game-layout">
        <div class="play-stack">
          <section class="glass-zone" aria-label="沙画罐">
            <div class="glass-frame">
              <canvas id="sand-canvas" width="384" height="480"></canvas>
            </div>
          </section>

          <section class="conveyor-zone" id="conveyor-zone" aria-label="传送带">
            <div id="conveyor" class="conveyor"></div>
          </section>

          <div id="fx-layer" class="fx-layer" aria-hidden="true"></div>
        </div>

        <section class="inventory-zone" aria-label="沙桶库存">
          <div id="inventory" class="inventory"></div>
        </section>
      </main>

      <div id="overlay" class="overlay hidden" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
